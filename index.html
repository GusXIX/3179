<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pubs in Melbourne</title>
  <script src="https://cdn.jsdelivr.net/npm/vega@6.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.1.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.0.2"></script>
  <style>
    html, body {
      font-family:  Helvetica, sans-serif;
    
      background-color: #e7e3e3;
               
      display: flex;
      justify-content: center;
      align-items: flex-start; 
    }
    h1 {
      font-size: 60px;
       display: flex;
      justify-content: center;
      align-items: flex-start; 
      margin-top: 0;  
    }
    .map-text {
      display: flex;
      margin: 0 auto;   
      text-align: center;
      justify-content: center;
      align-items: flex-start; 
    }
    #vis, #vis2, #vis3 ,#vis4{
      margin-top: 40px;
       max-width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-start; 
    }
    .container {
        max-width: 900px;   
        margin: 0 auto;
        padding: 20px;
        background-color: #fff;
}
  </style>
</head>
<body>
<div class="container">
<h1>Pubs in Melbourne</h1>

<div class="map-text">
  <div class="text">
    <h2>Main Suburbs of the Investigation into Melbourne Pubs</h2>
    <p>Here, are the main inner suburbs which will be discussed.<br>
        The colour of each dot represents the average rating on Yelp. <br>
        The main focus of these reviews are centered around Melbourne's CBD. 
    
    </p>
  </div>
  
</div>
<div id="vis"></div>
<div id="vis2"></div>
<div id="vis3"></div>
<div id="vis4"></div>
<script>
 
  const spec = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "title": "Pubs around Melbourne (Yelp)",
    "width": 600,
    "height": 600,
    "projection": {"type": "mercator"},
    "layer": [
      {
        "data": {
          "url": "https://raw.githubusercontent.com/GusXIX/3179/refs/heads/Week-9-Homework/js/SA2_2021_AUST_GDA2020.json",
          "format": {
            "type": "topojson",
            "feature": "SA2_2021_AUST_GDA2020"
          }
        },
        "mark": {
          "type": "geoshape",
          "fill": "lightgray",
          "stroke": "white"
        }
      },
      {
        "data": {
          "url": "https://raw.githubusercontent.com/GusXIX/3179/refs/heads/Week-9-Homework/data/Yelp_500_PUBS.csv"
        },
        "mark": {
          "type": "circle",
          "tooltip": {"content": "data"}
        },
        "encoding": {
          "longitude": {"field": "longitude", "type": "quantitative"},
          "latitude": {"field": "latitude", "type": "quantitative"},
          "color": {
            "field": "rating",
            "type": "quantitative",
            "title": "Yelp Rating",
            "scale": {"range": ["#FFD700", "#006400"]}
          },
          "tooltip": [
            { "field": "name", "type": "nominal", "title": "Name" },
            { "field": "latitude", "type": "quantitative", "title": "Latitude" },
            { "field": "longitude", "type": "quantitative", "title": "Longitude" },
            { "field": "review_count", "type": "quantitative", "title": "Review Count" }
          ]
        }
      }
    ]
  };

 
  const spec2 = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "title": "Bars & Pubs by Review Count",
    "width": 750,
    "height": 400,
    "data": {
      "url": "https://raw.githubusercontent.com/GusXIX/3179/refs/heads/Week-9-Homework/data/Yelp_500_PUBS.csv"
    },
    "mark": {
      "type": "circle",
      "opacity": 0.6
    },
    "encoding": {
      "x": {
        "field": "latitude",
        "type": "quantitative",
        "title": "Latitude",
        "scale": { "domain": [-38, -37.6] }
      },
      "y": {
        "field": "review_count",
        "type": "quantitative",
        "title": "Review Count"
      },
      "tooltip": [
            { "field": "name", "type": "nominal", "title": "Name" },
            { "field": "latitude", "type": "quantitative", "title": "Latitude" },
            { "field": "longitude", "type": "quantitative", "title": "Longitude" },
            { "field": "review_count", "type": "quantitative", "title": "Review Count" }
          ]
    }
  };

  
  const spec3 = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "title": "Distribution of Yelp Price ",
    "data": {
      "url": "https://raw.githubusercontent.com/GusXIX/3179/refs/heads/Week-9-Homework/data/Yelp_500_PUBS.csv"
    },
    "width": 600,
    "height": 300,
    "layer": [
      {
        "mark": "bar",
        "encoding": {
          "x": {
            "field": "price",
            "type": "ordinal",
            "title": "Price Score"
          },
          "y": {
            "aggregate": "count",
            "type": "quantitative",
            "title": "Number of Pubs"
          },
          "color": {
            "field": "rating",
            "type": "ordinal",
            "scale": { "scheme": "plasma" }
          },
          "tooltip": [
            { "field": "rating", "type": "ordinal", "title": "Rating" },
            { "aggregate": "count", "type": "quantitative", "title": "Number of Pubs" }
          ]
        }
      },
      {
        "transform": [
          {
            "aggregate": [{ "op": "count", "as": "price_count" }],
            "groupby": ["price"]
          },
          {
            "window": [{ "op": "rank", "as": "rank" }],
            "sort": [{ "field": "price_count", "order": "descending" }]
          },
          {
            "filter": "datum.rank == 1"
          },
          {
            "calculate": "'Most common price: ' + datum.price_count",
            "as": "text_annotation"
          }
        ],
        "mark": {
          "type": "text",
          "align": "center",
          "fontWeight": "bold",
          "color": "black"
        },
        "encoding": {
          "x": { "field": "rating", "type": "ordinal" },
          "y": { "field": "pub_count", "type": "quantitative" },
          "text": { "field": "text_annotation", "type": "nominal" }
        }
      }
    ]
  };
 
  const spec4 = {
    "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
    "title": "Distance Vs Rating",
    "width": 750,
    "height": 400,
    "data": {
      "url": "https://raw.githubusercontent.com/GusXIX/3179/refs/heads/Week-9-Homework/data/Yelp_500_PUBS.csv"
    },
    "mark": {
      "type": "circle",
      "opacity": 0.6
    },
    "encoding": {
      "x": {
        "field": "distance",
        "type": "quantitative",
        "title": "Distance from CBD(m)",
        
      },
      "y": {
        "field": "rating",
        "type": "quantitative",
        "title": "Average Rating"
      },
      "tooltip": [
            { "field": "name", "type": "nominal", "title": "Name" },
            { "field": "latitude", "type": "quantitative", "title": "Latitude" },
            { "field": "longitude", "type": "quantitative", "title": "Longitude" },
            { "field": "review_count", "type": "quantitative", "title": "Review Count" }
          ]
    }
  };

  
  
  vegaEmbed("#vis", spec, { mode: "vega-lite" }).then(console.log).catch(console.warn);
  vegaEmbed("#vis2", spec2, { mode: "vega-lite" }).then(console.log).catch(console.warn);
  vegaEmbed("#vis3", spec3, { mode: "vega-lite" }).then(console.log).catch(console.warn);
  vegaEmbed("#vis4", spec3, { mode: "vega-lite" }).then(console.log).catch(console.warn);
</script>
</div>
</body>
</html>

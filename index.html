<!DOCTYPE html>
<html>
<head>
    <title>Pubs in Melbourne</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@6.2.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.0.2"></script>
</head>
<body>
    <h1>Pubs in Melbourne</h1>
    <div id="vis"></div>
    <script>
        const spec = {
            "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
            "data": {
                "url": "https://raw.githubusercontent.com/GusXIX/3179/refs/heads/Week-10/data/Yelp_500_PUBS.csv"
            },
            "vconcat": [
                {
                    "width": 600,
                    "height": 300,
                    "title": "Review Count vs Distance from CBD",
                    "layer": [
                        {
                            "mark": {
                                "type": "circle",
                                "opacity": 0.4,

                            },
                            "encoding": {
                                "x": {
                                    "field": "distance",
                                    "type": "quantitative",
                                    "title": "Distance from CBD (m)",
                                    "scale": {"domain": {"param": "brush"}}
                                },
                                "y": {
                                    "field": "review_count",
                                    "type": "quantitative",
                                    "title": "Review Count"
                                },
                                "color": {
                                    "field": "rating",
                                    "type": "quantitative",
                                    "title": "Average Rating",
                                    "scale": {"scheme": "viridis"}
                                },
                                "tooltip": [
                                    {"field": "name", "type": "nominal", "title": "Pub Name"},
                                    {"field": "distance", "type": "quantitative", "title": "Distance from CBD (m)"},
                                    {"field": "review_count", "type": "quantitative", "title": "Review Count"},
                                    {"field": "rating", "type": "quantitative", "title": "Avg Rating"}
                                ]
                            }
                        },
                        {
                            "transform": [
                                {
                                    "aggregate": [{"op": "max", "field": "distance", "as": "max_dist"}]
                                },
                                {
                                    "lookup": "max_dist",
                                    "from": {
                                        "data": {
                                            "url": "https://raw.githubusercontent.com/GusXIX/3179/refs/heads/Week-10/data/Yelp_500_PUBS.csv"
                                        },
                                        "key": "distance",
                                        "fields": ["name", "distance", "review_count"]
                                    }
                                },
                                {
                                    "calculate": "'Furthest Pub from CBD: ' + datum.name + ';Reviews: ' + datum.distance",
                                    "as": "text_annotation_raw"
                                },
                                {
                                    "calculate": "split(datum.text_annotation_raw, ';')",
                                    "as": "text_annotation"
                                }
                            ],
                            "mark": {
                                "type": "text",
                                "align": "right",
                                "dx": -8,
                                "dy": -38,
                                "baseline": "middle",
                                "fontStyle": "italic",
                                "fontSize": 12
                            },
                            "encoding": {
                                "x": {"field": "distance", "type": "quantitative"},
                                "y": {"field": "review_count", "type": "quantitative"},
                                "text": {"field": "text_annotation", "type": "nominal"}
                            }
                        }
                    ]
                },
                {
                    "width": 600,
                    "height": 120,
                    "mark": "line",
                    "params": [
                        {"name": "brush", "select": {"type": "interval", "encodings": ["x"]}}
                    ],
                    "encoding": {
                        "x": {
                            "field": "distance",
                            "type": "quantitative",
                            "title": "Distance from CBD (m)"
                        },
                        "y": {
                            "field": "review_count",
                            "type": "quantitative",
                            "title": "Review Count"
                        }
                    }
                }
            ]
        };

        vegaEmbed("#vis", spec, {mode: "vega-lite"}).then(console.log).catch(console.warn);
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Pubs in Melbourne</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@6.2.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.0.2"></script>
</head>
<body>
    <h1>Pubs in Melbourne</h1>
    <div id="vis"></div>
    <script>
        const spec = {
            "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
            "data": {
                "url": "https://raw.githubusercontent.com/GusXIX/3179/refs/heads/Week-10/data/Yelp_500_PUBS.csv"
            },
            "vconcat": [
                {
                    "width": 600,
                    "height": 300,
                    "title": "Review Count vs Distance from CBD",
                    "layer": [
                        {
                            "transform": [
                                { "filter": { "param": "brush" } }
                            ],
                            "mark": {
                                "type": "circle",
                                "opacity": 0.6
                            },
                            "encoding": {
                                "x": {
                                    "field": "distance",
                                    "type": "quantitative",
                                    "title": "Distance from CBD (m)"
                                },
                                "y": {
                                    "field": "review_count",
                                    "type": "quantitative",
                                    "title": "Review Count"
                                },
                                "color": {
                                    "field": "rating",
                                    "type": "quantitative",
                                    "title": "Average Rating",
                                    "scale": {"scheme": "viridis"}
                                },
                                "tooltip": [
                                    {"field": "name", "type": "nominal", "title": "Pub Name"},
                                    {"field": "distance", "type": "quantitative", "title": "Distance from CBD (m)"},
                                    {"field": "review_count", "type": "quantitative", "title": "Review Count"},
                                    {"field": "rating", "type": "quantitative", "title": "Avg Rating"}
                                ]
                            }
                        }
                    ]
                },
                {
                    "width": 600,
                    "height": 120,
                    "mark": "line",
                    "params": [
                        {
                            "name": "brush",
                            "select": { "type": "interval", "encodings": ["x"] }
                        }
                    ],
                    "encoding": {
                        "x": {
                            "field": "distance",
                            "type": "quantitative",
                            "title": "Distance from CBD (m)"
                        },
                        "y": {
                            "field": "review_count",
                            "type": "quantitative",
                            "title": "Review Count"
                        }
                    }
                },
                // Bar Chart with annonation
                {
                "width": 600,
                "height": 300,
                "layer": [
                    {
                    "mark": "bar",
                    "encoding": {
                        "x": {
                        "field": "rating",
                        "type": "ordinal",
                        "title": "Average Rating"
                        },
                        "y": {
                        "aggregate": "count",
                        "type": "quantitative",
                        "title": "Number of Pubs"
                        },
                        "color": {
                        "field": "rating",
                        "type": "ordinal",
                        "scale": { "scheme": "blues" }
                        },
                        "tooltip": [
                        { "field": "rating", "type": "ordinal", "title": "Rating" },
                        { "aggregate": "count", "type": "quantitative", "title": "Number of Pubs" }
                        ]
                    }
                    },
                    {
                    "transform": [
                        {
                        "aggregate": [{ "op": "count", "as": "pub_count" }],
                        "groupby": ["rating"]
                        },
                        {
                        "window": [{ "op": "rank", "as": "rank" }],
                        "sort": [{ "field": "pub_count", "order": "descending" }]
                        },
                        {
                        "filter": "datum.rank == 1"
                        },
                        {
                        "calculate": "'Most common Yelp review count: ' + datum.pub_count",
                        "as": "text_annotation"
                        },
                    ],
                    "mark": {
                        "type": "text",
                        "align": "center",
                        "fontWeight": "bold",
                        "color": "black"
                    },
                    "encoding": {
                        "x": { "field": "rating", "type": "ordinal" },
                        "y": { "field": "pub_count", "type": "quantitative" },
                        "text": { "field": "text_annotation", "type": "nominal" }
                    }
                    }
                ]
                }

            ]
        };

        vegaEmbed("#vis", spec, {mode: "vega-lite"}).then(console.log).catch(console.warn);
    </script>
</body>
</html>
